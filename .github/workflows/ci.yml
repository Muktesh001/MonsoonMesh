name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node.js Tests & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint web app
        run: npm run lint -w apps/web
      - name: Build all packages
        run: npm run build
      - name: Run API tests
        run: npm test
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  ai-service:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/ai-service/requirements.lock
      - name: Run tests
        run: pytest -q
        working-directory: apps/ai-service

  containers:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_DB: monsoonmesh
          POSTGRES_USER: monsoonmesh
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build API
        run: npm run build -w apps/api
      - name: Run migrations
        run: npm run migrate -w apps/api
        env:
          DATABASE_URL: postgres://monsoonmesh:testpass@localhost:5432/monsoonmesh
          NODE_ENV: test
      - name: Seed database
        run: npm run seed -w apps/api
        env:
          DATABASE_URL: postgres://monsoonmesh:testpass@localhost:5432/monsoonmesh
          NODE_ENV: test
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Build web app
        run: npm run build -w apps/web
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://monsoonmesh:testpass@localhost:5432/monsoonmesh
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-key-min-32-characters
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/ai-service/requirements.lock
      - name: Run pip audit
        run: pip-audit
        continue-on-error: true

  status:
    name: Test Status Summary
    runs-on: ubuntu-latest
    needs: [node, ai-service, containers, e2e, security]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.node.result }}" == "failure" ] || \
             [ "${{ needs.ai-service.result }}" == "failure" ] || \
             [ "${{ needs.containers.result }}" == "failure" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          else
            echo "✅ CI Pipeline passed"
          fi
